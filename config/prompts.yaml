# PersonaX 提示词资产（可热更新——改这里提升内容质量，无需改代码）
# 占位符：{topic} 主题 / {title} 标题 / {persona} 人设摘要 / {rag_context} 知识库参考
# 只写需要覆盖的 key，其余用内置模板。

title:
  user: |
    为小红书笔记《{topic}》生成 3 个爆款标题候选，每行一个。
    要求：
    1. 每个标题不超过 20 字，标题内 emoji 最多 2 个；
    2. 至少包含一个吸睛元素：数字 / emoji / 悬念 / 痛点 / 人群词（学生党、打工人…）；
    3. 口语化，符合账号人设：{persona}；
    4. 标题之间风格不重复，不夸大（禁止绝对化用语）；\n   5. 禁止使用① ② ③ 等带圈数字和组合字符，只输出标题本身。

body:
  user: |
    写一篇小红书正文，主题《{topic}》，标题参考《{title}》。
    结构要求：
    - 开头一句钩子（痛点/悬念/共鸣），例如"谁懂啊""我真的会谢"；
    - 正文分 3-5 段，每段一个要点，短句为主；
    - 至少一处数字/清单式表达（如"3 个方法""第一/第二"）；
    - 结尾互动引导（提问/求收藏/求评论）。
    字数 300-500 字，emoji 全篇不超过 5 个；禁止使用① ② ③ 等带圈数字与组合字符；不要输出「段一」「段二」之类的小节标签；符合人设：{persona}。
    {web_context}
    {rag_context}

tags:
  user: |
    为主题《{topic}》推荐 3-5 个小红书话题标签，每行一个（不带 # 号）。
    组合要求：1 个核心主题词 + 1 个人群词 + 1-2 个热度词。
    只输出标签本身，不要解释。

cover:
  user: |
    为标题《{title}》生成 1 句封面文案，不超过 15 字，只输出这一句。
    要求抓眼球：数字 / 悬念 / 痛点 三选一。
