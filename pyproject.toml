[project]
name = "personax"
version = "2.8.1"
description = "具备安全 JSON/SSE 服务接口、持久化 HITL 与可信 RAG 的本地内容 Agent"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "anyio>=4,<5",
    "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio", "pytest-cov>=5.0", "httpx>=0.27,<1"]
publish = ["playwright>=1.40"]
web = ["streamlit>=1.62,<2"]
rag = ["sentence-transformers>=3.0"]
ingest = ["pypdf>=6,<7"]
ocr = ["pypdfium2>=4.30,<6", "paddleocr>=3.4,<4", "paddlepaddle>=3.2,<4"]
vector = ["qdrant-client>=1.19,<2"]
all = ["pytest>=8.0", "httpx>=0.27,<1", "playwright>=1.40", "streamlit>=1.62,<2", "sentence-transformers>=3.0", "pypdf>=6,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "skills*", "publishers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
