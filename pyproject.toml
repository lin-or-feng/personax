[project]
name = "personax"
version = "0.1.0"
description = "基于 LangGraph × Harness × Skill 的小红书内容生成 Agent"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio"]
publish = ["playwright>=1.40"]
web = ["streamlit>=1.30"]
all = ["pytest>=8.0", "playwright>=1.40", "streamlit>=1.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "skills*", "publishers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
