[project]
name = "personax"
version = "2.2.0"
description = "具备持久化工作流、可观测评测与安全门禁的本地内容 Agent"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio"]
publish = ["playwright>=1.40"]
web = ["streamlit>=1.30"]
rag = ["sentence-transformers>=3.0"]
all = ["pytest>=8.0", "playwright>=1.40", "streamlit>=1.30", "sentence-transformers>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "skills*", "publishers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
