name: PersonaX quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and quality dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q app.py core publishers eval scripts

      - name: Run tests with coverage floor
        run: python -m pytest --cov=core --cov=publishers --cov-report=term-missing --cov-fail-under=55

      - name: Run offline quality and security gates
        run: python scripts/release_check.py
